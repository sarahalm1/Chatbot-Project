name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stage7-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stage7-backend:${{ github.sha }}

      - name: Build and push chatbot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chatbot
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stage7-chatbot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stage7-chatbot:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run update_app.sh on the VM
        run: |
          out=$(az vm run-command invoke \
            --resource-group "${{ secrets.RESOURCE_GROUP_NAME }}" \
            --name "${{ secrets.VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "sudo -u azureuser -H bash /home/azureuser/Chatbot-Project/update_app.sh && echo DEPLOY_OK" \
            --query "value[0].message" \
            -o tsv)

          echo "$out"
          echo "$out" | grep -q DEPLOY_OK